<html lang="en">
<head>

<script>
/* ============================================================
   LINKS: edit this list to add, remove or reorder buttons.
   One line per button:
     { label: "Button text", url: "https://...", note: "small grey text (optional)",
       icon: "download" | "itch" | "play" | "web" | "tiktok" | "instagram" | "youtube" | "x" | "discord" | "github",
       primary: true  (optional: big orange button) }
   Save the file, commit, and the page updates in about a minute.
   ============================================================ */
const LINKS = [
  { label: "Get ORRIN", url: "https://orrin.sites.tab.bot", note: "Windows 10 & 11", icon: "download", primary: true },
  { label: "itch.io (coming soon)", url: "https://orrin.sites.tab.bot", note: "ORRIN on itch.io", icon: "itch" },
  { label: "Watch the trailer", url: "assets/orrin_trailer.mp4", note: "25 seconds of the real app", icon: "play", action: "trailer" },
  { label: "Join the Discord", url: "https://discord.gg/x57tQ25QHx", note: "Updates, help and bug reports", icon: "discord" },
];
</script>
<style>
  :root{
    --bg:#0b0d1a; --card:#141729; --card2:#1a1e35; --line:#2a2f4d;
    --text:#eef0ff; --muted:#9aa0c3; --orange:#ff9a4a; --orange2:#ffb877; --violet:#8a8cf0; --lav:#c7a6d9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(700px 520px at 50% 8%, rgba(255,138,61,.16), transparent 70%),
      radial-gradient(600px 500px at 85% 100%, rgba(98,100,220,.16), transparent 70%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    padding:max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  }
  main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:84px;height:84px;margin-top:12px;filter:drop-shadow(0 0 22px rgba(255,138,61,.35))}
  .logo .spin{transform-origin:32px 32px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.logo .spin{animation:none}}
  h1{
    margin:18px 0 6px;font-size:clamp(44px,14vw,64px);letter-spacing:.22em;padding-left:.22em;font-weight:800;line-height:1;
    background:linear-gradient(90deg,var(--orange2),var(--orange) 40%,var(--lav));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tag{margin:10px 4px 0;color:#d4d7f2;font-size:17px;max-width:24em}
  .tag b{color:var(--text);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 24px}
  .chip{font-size:13px;color:var(--muted);border:1px solid var(--line);background:rgba(20,23,41,.7);padding:5px 11px;border-radius:999px}
  nav{width:100%;display:flex;flex-direction:column;gap:12px}
  a.btn{
    display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;border-radius:16px;
    text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);
    text-align:left;transition:transform .12s ease, border-color .15s, background .15s;
    -webkit-tap-highlight-color:transparent;
  }
  a.btn:hover{border-color:#4a4f7a;background:var(--card2)}
  a.btn:active{transform:scale(.985)}
  a.btn:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
  .ic{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#0f1222;border:1px solid var(--line)}
  .ic svg{width:22px;height:22px}
  .txt{flex:1;min-width:0}
  .lbl{display:block;font-weight:650;font-size:17px}
  .note{display:block;font-size:13px;color:var(--muted);margin-top:1px}
  .arr{opacity:.45;font-size:20px}
  a.btn.primary{
    min-height:76px;border:0;color:#1b0f05;
    background:linear-gradient(135deg,#ffc489,#ff9a4a 55%,#ff7d3a);
    box-shadow:0 10px 34px -10px rgba(255,138,61,.65), inset 0 1px 0 rgba(255,255,255,.4);
  }
  a.btn.primary:hover{filter:brightness(1.05)}
  a.btn.primary .lbl{font-size:20px;font-weight:800}
  a.btn.primary .note{color:rgba(27,15,5,.72)}
  a.btn.primary .ic{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.35)}
  a.btn.primary .arr{opacity:.7}
  .trailer{width:100%;margin-top:26px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000;
    box-shadow:0 18px 50px -24px rgba(98,100,220,.55)}
  .trailer video{display:block;width:100%;aspect-ratio:16/9;background:#000}
  .cap{font-size:13px;color:var(--muted);margin:8px 0 0}
  footer{margin-top:30px;font-size:13px;color:#6e7399}
  footer a{color:#8f94bd}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <defs><radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff3df"/><stop offset=".45" stop-color="#ffb066"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient></defs>
    <path d="M50.5 44.5A22 22 0 1 1 52 22" fill="none" stroke="#ff9a4a" stroke-width="3.5" stroke-linecap="round"/>
    <circle class="spin" cx="32" cy="32" r="14" fill="none" stroke="#8a8cf0" stroke-width="2.4" stroke-dasharray="10 5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="10" fill="url(#core)"/>
  </svg>
  <h1>ORRIN</h1>
  <p class="tag">A voice assistant that runs on <b>your own PC</b>. Free local AI, no account, no keys.</p>
  <div class="chips"><span class="chip">Windows 10 &amp; 11</span><span class="chip">Runs locally</span><span class="chip">MIT licence</span></div>

  <nav id="links" aria-label="Links"></nav>

  <section class="trailer" id="trailer" aria-label="ORRIN trailer">
    <video id="trailerVideo" controls playsinline preload="metadata" poster="assets/trailer_poster.jpg">
      <source src="assets/orrin_trailer.mp4" type="video/mp4">
      <a href="assets/orrin_trailer.mp4">Watch the ORRIN trailer</a>
    </video>
  </section>
  <p class="cap">Trailer · captured from the real app</p>

  <footer>© 2026 ORRIN</footer>
</main>
<script>
const ICONS = {
  download:'<path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  itch:'<path d="M4 9l1.5-4h13L20 9v1.2a2.4 2.4 0 01-4 1.8 2.4 2.4 0 01-4 0 2.4 2.4 0 01-4 0 2.4 2.4 0 01-4-1.8z M5 12.5V19h14v-6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 16.5l2-2 2 2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  play:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/>',
  web:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  tiktok:'<path d="M14 4v10.5a3.5 3.5 0 11-3.5-3.5M14 4c.5 2.6 2.3 4 5 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="16.8" cy="7.2" r="1.1" fill="currentColor"/>',
  youtube:'<rect x="3" y="6" width="18" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.5 9.5v5l4.3-2.5z" fill="currentColor"/>',
  x:'<path d="M5 4l14 16M19 4L5 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  discord:'<path d="M7 7c3-1.3 7-1.3 10 0l2 9c-1.6 1.3-3.3 2-5 2.3l-.8-1.6M7 7L5 16c1.6 1.3 3.3 2 5 2.3l.8-1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="9.6" cy="12.3" r="1.2" fill="currentColor"/><circle cx="14.4" cy="12.3" r="1.2" fill="currentColor"/>',
  github:'<path d="M9 19c-4 1.3-4-2-6-2.5m12 4.5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 00-1.3-3.2 4.2 4.2 0 00-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 00-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 00-.1 3.2A4.6 4.6 0 004 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav = document.getElementById('links');
nav.innerHTML = LINKS.map(l => {
  const external = /^https?:/i.test(l.url);
  return `<a class="btn${l.primary ? ' primary' : ''}" href="${esc(l.url)}"${external ? ' target="_blank" rel="noopener"' : ''}${l.action ? ` data-action="${esc(l.action)}"` : ''}>
    <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[l.icon] || ICONS.web}</svg></span>
    <span class="txt"><span class="lbl">${esc(l.label)}</span>${l.note ? `<span class="note">${esc(l.note)}</span>` : ''}</span>
    <span class="arr" aria-hidden="true">›</span></a>`;
}).join('');
nav.addEventListener('click', e => {
  const a = e.target.closest('a[data-action="trailer"]');
  if (!a) return;
  const v = document.getElementById('trailerVideo');
  if (!v) return;
  e.preventDefault();
  document.getElementById('trailer').scrollIntoView({behavior:'smooth', block:'center'});
  v.play().catch(() => {});
});
</script>
</body>
</html>
